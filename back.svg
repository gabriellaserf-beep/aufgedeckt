<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#241238"/><stop offset="0.5" stop-color="#170a28"/><stop offset="1" stop-color="#12071f"/>
  </linearGradient>
  <radialGradient id="corner" cx="0" cy="0" r="1">
    <stop offset="0" stop-color="#ff00fe" stop-opacity="0.32"/><stop offset="0.35" stop-color="#ff00fe" stop-opacity="0.06"/><stop offset="1" stop-color="#ff00fe" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cornerR" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#ff00fe" stop-opacity="0.12"/><stop offset="1" stop-color="#ff00fe" stop-opacity="0"/>
  </radialGradient>
  <!-- großer Bogen A: Füllung -->
  <radialGradient id="fillA" cx="0.62" cy="0.18" r="0.5">
    <stop offset="0" stop-color="#5a1f86" stop-opacity="0.9"/><stop offset="0.45" stop-color="#22103f" stop-opacity="0.85"/><stop offset="1" stop-color="#140822" stop-opacity="0.9"/>
  </radialGradient>
  <!-- Kugel B: Füllung -->
  <radialGradient id="fillB" cx="0.62" cy="0.14" r="0.55">
    <stop offset="0" stop-color="#3b72c4" stop-opacity="0.85"/><stop offset="0.35" stop-color="#2a1656" stop-opacity="0.9"/><stop offset="1" stop-color="#12071f" stop-opacity="1"/>
  </radialGradient>
  <linearGradient id="rimA" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#ff3df5"/><stop offset="0.45" stop-color="#ff7af8"/><stop offset="0.75" stop-color="#9a6bff"/><stop offset="1" stop-color="#59d5dc"/>
  </linearGradient>
  <linearGradient id="rimB" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#ff00fe"/><stop offset="0.4" stop-color="#ff5af6"/><stop offset="0.75" stop-color="#6ff0f7"/><stop offset="1" stop-color="#59d5dc"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="clipA"><circle cx="-20" cy="254" r="190"/></clipPath>
</defs>
<rect width="100" height="140" fill="url(#bg)"/>
<rect width="100" height="140" fill="url(#corner)"/>
<rect width="100" height="140" fill="url(#cornerR)"/>

<!-- Bogen A -->
<circle cx="-20" cy="254" r="190" fill="url(#fillA)"/>
<circle cx="-20" cy="254" r="190" fill="none" stroke="#ff00fe" stroke-opacity="0.5" stroke-width="6" filter="url(#soft)"/>
<circle cx="-20" cy="254" r="190" fill="none" stroke="url(#rimA)" stroke-width="2.2" stroke-opacity="0.75" filter="url(#glow)"/>
<circle cx="-20" cy="254" r="190" fill="none" stroke="url(#rimA)" stroke-width="0.55"/>
<circle cx="-20" cy="254" r="186.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.3"/>

<!-- Kugel B, im Bogen A -->
<g clip-path="url(#clipA)">
  <circle cx="86" cy="197" r="96" fill="url(#fillB)"/>
  <circle cx="86" cy="197" r="96" fill="none" stroke="#ff00fe" stroke-opacity="0.55" stroke-width="7" filter="url(#soft)"/>
</g>
<circle cx="86" cy="197" r="96" fill="none" stroke="url(#rimB)" stroke-width="2.4" stroke-opacity="0.8" filter="url(#glow)"/>
<circle cx="86" cy="197" r="96" fill="none" stroke="url(#rimB)" stroke-width="0.6"/>
<circle cx="86" cy="197" r="93" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.3"/>
</svg>